# boss_profiles.conf — per-boss fleet profiles, applied by `fleet> boss <id>`
#
# Format (one line per boss):
#   <npc_id>  key=value  key=value ...
#
# Special keys:
#   world=<name>   Use this world (.wld name in your save dir's Worlds/) for
#                  the fleet — YOUR pre-built arena world for that boss stage.
#                  Applied to fleet.conf; takes effect on 'restart'.
#   time=<v>       day | noon | night | midnight | none → sets ForceTimeOfDay
#                  (requires the patched BossMLMod).
#   player=<name>  Use this character (.plr name) — e.g. a hardmode-geared one.
#
# Any other key=value is written straight into every instance's BossMLMod
# config (same as `fleet> modset`), e.g. ArenaPlatforms=20 FrameSkip=2.
#
# Fill in world=/player= with your own arena worlds per progression stage.
# Examples (uncomment and adapt):

# ── Pre-hardmode ─────────────────────────────────────────────────────────────
50   time=day    ArenaPlatforms=8     # King Slime
4    time=night  ArenaPlatforms=10    # Eye of Cthulhu (night only, enrages at dawn)
13   time=day    ArenaPlatforms=8     # Eater of Worlds     world=CorruptionArena
266  time=day    ArenaPlatforms=8     # Brain of Cthulhu    world=CrimsonArena
222  time=day    ArenaPlatforms=12    # Queen Bee           world=JungleArena
35   time=night  ArenaPlatforms=10    # Skeletron
668  time=day    ArenaPlatforms=6     # Deerclops
113  time=day    ArenaPlatforms=4     # Wall of Flesh       world=HellBridge

# ── Hardmode (more platforms — flying bosses need vertical room) ─────────────
657  time=day    ArenaPlatforms=16    # Queen Slime
125  time=night  ArenaPlatforms=20    # The Twins
134  time=night  ArenaPlatforms=16    # The Destroyer
127  time=night  ArenaPlatforms=20    # Skeletron Prime
262  time=day    ArenaPlatforms=14    # Plantera            world=JungleArena
245  time=day    ArenaPlatforms=10    # Golem               world=TempleArena
370  time=day    ArenaPlatforms=18    # Duke Fishron        world=OceanArena
636  time=night  ArenaPlatforms=20    # Empress of Light (night = non-lethal mode)
398  time=day    ArenaPlatforms=20    # Moon Lord
