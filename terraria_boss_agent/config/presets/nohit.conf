# No-Hit: Train the agent to kill bosses without taking any damage.
#
# Philosophy:
#   A single hit costs more reward than the entire kill bonus.
#   The ONLY profitable strategy is dealing damage in safe windows
#   while dodging everything. Trading HP for damage is never worth it.
#
# Math at player_damage_weight=100:
#   - A 40-damage hit on a 400 HP player = 10% HP loss
#   - Penalty: 100 * 0.10 = 10.0 (equals the entire kill bonus)
#   - Two hits = net negative even if you kill the boss
#   - Agent MUST find zero-hit attack windows to profit
#
# Training strategy:
#   - High entropy (0.04) for exploring dodge patterns early
#   - Lower learning rate (0.00015) for stable convergence
#   - High gamma (0.997) so the agent values long-term survival
#   - Large rollouts (4096 steps) to capture full fight arcs
#   - Longer episodes (27000 = ~7.5 min) since careful play is slow
#   - 5M timesteps — no-hit takes longer to converge

# --- Reward: make any damage catastrophic ---
reward.player_damage_weight=100.0
reward.boss_damage_weight=2.0
reward.boss_kill_bonus=10.0
reward.death_penalty=50.0
reward.despawn_penalty=20.0
reward.survival_bonus=0.005
reward.wasteful_heal_penalty=0.0
reward.distance_penalty_weight=0.0005
reward.distance_sq_penalty_weight=0.0000005
reward.distance_threshold=600.0

# --- Training: explore more, learn carefully ---
training.learning_rate=0.00015
training.gamma=0.997
training.gae_lambda=0.98
training.ent_coef=0.04
training.clip_range=0.15
training.n_steps=4096
training.batch_size=128
training.n_epochs=8
training.total_timesteps=5000000

# --- Episodes: longer fights, patient play ---
episode.max_steps=27000
episode.reward_scale=1.0
